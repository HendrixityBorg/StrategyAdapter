challenge: SX-CH-003
contract_version: "1.1.0"
policy:
  no_silent_fallback: true
  strict_compatibility_default: true
  generated_checks_may_not_skip: true

criteria:
  engineering:
    description: 完整仓库、锁定环境、配置、合成 fixture 与一键复现。
    evidence:
      - README.md
      - pyproject.toml
      - Makefile
      - Dockerfile
      - .dockerignore
      - uv.lock
      - scripts/verify-container.sh
      - .github/workflows/ci.yml
      - tests/e2e/test_cli.py
      - reports/generated/acceptance-report.json

  contract:
    description: 策略、数据、账户、动作、产物、日志与报告的版本化 Schema 和生命周期。
    evidence:
      - spec/contract-v1.md
      - spec/lifecycle.md
      - spec/runtime-interfaces.md
      - spec/package.md
      - spec/errors.md
      - schemas/generated
      - tests/e2e/test_json_schema_interop.py
      - src/psrc/contract
      - src/psrc/domain
      - src/psrc/runtime

  strategies:
    description: 规则、监督学习、强化学习各 6 个，且具有实质差异的示例。
    required_counts:
      rule: 6
      supervised: 6
      reinforcement_learning: 6
    evidence:
      - strategies
      - docs/strategy-matrix.md
      - tests/integration/test_rule_strategy_matrix.py
      - tests/integration/test_supervised_strategy_matrix.py
      - tests/integration/test_rl_strategy_matrix.py

  explainable_failures:
    description: 强制失败结构化，兼容性转换显式且可审计。
    required_error_codes:
      - DATA_FIELD_MISSING
      - DATA_TIMEFRAME_MISMATCH
      - SYMBOL_MAPPING_FAILED
      - ARTIFACT_NOT_FOUND
      - ACTION_INVALID
      - ORDER_REJECTED
      - TRAINING_FAILED
      - BACKTEST_FAILED
    evidence:
      - spec/errors.md
      - spec/compatibility.md
      - tests/negative
      - reports/generated/runs/failures/summary.json
      - reports/generated/runs/compatibility/bundle.json

  tests_security_extension:
    description: 正常与失败测试、严格沙箱、适配器、能力画像和统一报告。
    required_verified_adapters:
      - reference
      - backtrader
      - nautilus-trader
    required_profiled_engines:
      - lean
      - qlib
      - vnpy
    evidence:
      - tests
      - src/psrc/sandbox
      - src/psrc/adapters
      - src/psrc/adapters/registry.py
      - engine_profiles
      - tests/adapters
      - tests/integration/test_strategy_packages.py
      - docs/adapter-guide.md
      - docs/acceptance-audit.md
      - reports/generated/acceptance-report.json
